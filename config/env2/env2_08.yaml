world:
  px_per_cm: 0.7
  screen_w: 1400
  screen_h: 1400
  bg_color: [245, 245, 245]
  fps: 60
  steps: 20
  step_plan_iters: 12

agents:
  - name: a0
    radius: 25
    start: [250, 700]
    goal: [1050, 250]
    color: [220, 50, 50]
    path: {type: straight, num_points: 80}

  - name: a1
    radius: 25
    start: [1150, 700]
    goal: [350, 250]
    color: [50, 50, 220]
    path: {type: straight, num_points: 80}

  - name: a2
    radius: 25
    start: [350, 1150]
    goal: [1150, 700]
    color: [50, 180, 50]
    path: {type: straight, num_points: 80}

  - name: a3
    radius: 25
    start: [1050, 1150]
    goal: [250, 700]
    color: [220, 140, 40]
    path: {type: straight, num_points: 80}

