  - name: wall_top
    type: rectangle
    center: [700, 150]
    size: [1040, 40]

  # Pared inferior
  - name: wall_bottom
    type: rectangle
    center: [700, 1250]
    size: [1040, 40]

  # Pared izquierda
  - name: wall_left
    type: rectangle
    center: [200, 700]
    size: [40, 1140]

  # Pared derecha
  - name: wall_right
    type: rectangle
    center: [1200, 700]
    size: [40, 1140]

  # Mesa (huella aprox del box de colisión en XY)
  - name: office_table
    type: rectangle
    center: [500, 600]
    size: [80, 43]

  # Silla (huella aprox del box de colisión en XY)
