  screen_w: 1400
  screen_h: 1400
  bg_color: [245, 245, 245]
  fps: 60
  steps: 12
  step_plan_iters: 12

agents:
  - name: a0
    radius: 25
    start: [450, 300]
    goal: [950, 1100]
    color: [220, 50, 50]
    path:
      type: straight
      num_points: 80

  - name: a1
    radius: 25
    start: [950, 300]
    goal: [500, 1100]
    color: [50, 50, 220]
    path:
      type: straight
      num_points: 80

obstacles:
