world:
  px_per_cm: 0.8
  screen_w: 1400
  screen_h: 1400
  bg_color: [245, 245, 245]
  fps: 60
  steps: 8
  step_plan_iters: 12

agents:
  - name: a0
    radius: 25
    start: [450, 300]
    goal: [950, 1100]
    color: [220, 50, 50]
    path:
      type: straight
      num_points: 80

  - name: a1
    radius: 25
    start: [950, 300]
    goal: [500, 1100]
    color: [50, 50, 220]
    path:
      type: straight
      num_points: 80

obstacles:
  # Pared superior (más larga para solapar con laterales)
  - name: wall_top
    type: rectangle
    center: [700, 150]
    size: [1040, 40]

  # Pared inferior (más larga para solapar con laterales)
  - name: wall_bottom
    type: rectangle
    center: [700, 1250]
    size: [1040, 40]

  # Pared izquierda (más alta para solapar con superior e inferior)
  - name: wall_left
    type: rectangle
    center: [200, 700]
    size: [40, 1140]

  # Pared derecha (más alta para solapar con superior e inferior)
  - name: wall_right
    type: rectangle
    center: [1200, 700]
    size: [40, 1140]

  # Obstáculo interior 1
  - name: obs_inner_1
    type: rectangle
    center: [500, 600]
    size: [80, 120]

  # Obstáculo interior 2 (convertido a círculo)
  - name: obs_inner_2
    type: circle
    position: [850, 850]
    radius: 60