##############################
#### 6 AGENTS EASY-MEDIUM PYGAME ROOM TEST ####
##############################

world:
  px_per_cm: 0.8
  screen_w: 1400
  screen_h: 1200
  bg_color: [245, 245, 245]
  fps: 60
  steps: 8
  step_plan_iters: 12

  # Solo para visualización 2D/Pygame
  wall_height_m: 3.0
  floor_color: [0.78, 0.74, 0.68, 1.0]
  wall_color: [0.82, 0.82, 0.80, 1.0]

agents:

  # Grande: diagonal principal
  - name: adam_blue
    radius: 60
    start: [210, 280]
    goal: [1160, 900]
    color: [50, 80, 220]
    path:
      type: straight
      num_points: 140

  # Pequeño: diagonal contraria
  - name: turtle_red
    radius: 25
    start: [1180, 920]
    goal: [220, 280]
    color: [220, 50, 50]
    path:
      type: straight
      num_points: 140

  # Medio: izquierda a derecha
  - name: robot_green
    radius: 35
    start: [180, 620]
    goal: [1220, 620]
    color: [40, 170, 80]
    path:
      type: straight
      num_points: 140

  # Medio-grande: derecha a izquierda, algo desplazado
  - name: robot_orange
    radius: 45
    start: [1220, 500]
    goal: [180, 740]
    color: [240, 145, 30]
    path:
      type: straight
      num_points: 140

  # Pequeño: abajo izquierda a arriba derecha
  - name: scout_purple
    radius: 22
    start: [250, 970]
    goal: [1140, 260]
    color: [150, 70, 200]
    path:
      type: straight
      num_points: 140

  # Grande, pero no enorme
  - name: heavy_cyan
    radius: 55
    start: [1120, 270]
    goal: [260, 980]
    color: [40, 190, 200]
    path:
      type: straight
      num_points: 140


