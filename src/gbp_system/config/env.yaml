##############################
#### ADAM + TURTLEBOT CIRCLE ROOM TEST ####
##############################

world:
  px_per_cm: 0.8
  screen_w: 1400
  screen_h: 1200
  bg_color: [245, 245, 245]
  fps: 60
  steps: 12
  step_plan_iters: 12

  # PyBullet visual settings
  wall_height_m: 3.0
  floor_color: [0.78, 0.74, 0.68, 1.0]
  wall_color: [0.82, 0.82, 0.80, 1.0]

agents:
  # =========================
  # ADAM - LARGE AGENT
  # Ahora sale desde arriba-izquierda
  # =========================
  - name: a0
    radius: 60
    start: [230, 340]
    goal: [1160, 850]
    color: [50, 50, 220]
    urdf_path: "/home/vrs/GBP_ROS_WS/src/gbp_system/src/gbp_system/AdamSim/models/robot/rb1_base_description/robots/robot.urdf"
    yaw_offset_deg: 180.0
    path:
      type: straight
      num_points: 120

  # =========================
  # TURTLEBOT - SMALL AGENT
  # Ahora sale desde abajo-derecha
  # =========================
  - name: a1
    radius: 25
    start: [1160, 850]
    goal: [230, 340]
    color: [220, 50, 50]
    urdf_path: "/home/vrs/GBP_ROS_WS/src/gbp_system/src/gbp_system/AdamSim/models/robot/rb1_base_description/robots/turtlebot.urdf"
    path:
      type: straight
      num_points: 120

obstacles:

  # =========================
  # PAREDES EXTERIORES
  # =========================
  - name: wall_left
    type: rectangle
    center: [-60, 600]
    size: [160, 1200]

  - name: wall_right
    type: rectangle
    center: [1460, 600]
    size: [160, 1200]

  - name: wall_top
    type: rectangle
    center: [700, -60]
    size: [1400, 160]

  - name: wall_bottom
    type: rectangle
    center: [700, 1260]
    size: [1400, 160]

  # =========================
  # OBSTÁCULOS CIRCULARES INTERIORES
  # =========================

  # Obstáculo cerca de la entrada de Adam anterior.
  - name: adam_entry_pillar
    type: circle
    position: [980, 455]
    radius: 65
    z: 0.0
    yaw_deg: 0.0

  # Obstáculo cerca de la entrada de Turtlebot anterior.
  - name: turtle_entry_pillar
    type: circle
    position: [430, 660]
    radius: 55
    z: 0.0
    yaw_deg: 0.0

  # Obstáculo inferior intermedio.
  - name: lower_mid_pillar
    type: circle
    position: [790, 790]
    radius: 65
    z: 0.0
    yaw_deg: 0.0