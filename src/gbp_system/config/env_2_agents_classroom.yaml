world:
  px_per_cm: 0.8
  screen_w: 1400
  screen_h: 1400
  bg_color: [245, 245, 245]
  fps: 60
  steps: 8
  step_plan_iters: 12

agents:
  - name: a0
    radius: 25
    start: [350, 250]
    goal: [1050, 1150]
    color: [220, 50, 50]
    path:
      type: straight
      num_points: 80

  - name: a1
    radius: 25
    start: [1050, 250]
    goal: [350, 1150]
    color: [50, 50, 220]
    path:
      type: straight
      num_points: 80

obstacles:
  # =========================
  # PAREDES DE LA HABITACIÓN
  # =========================
  - name: wall_top
    type: rectangle
    center: [700, 100]
    size: [1200, 40]

  - name: wall_bottom
    type: rectangle
    center: [700, 1300]
    size: [1200, 40]

  - name: wall_left
    type: rectangle
    center: [100, 700]
    size: [40, 1240]

  - name: wall_right
    type: rectangle
    center: [1300, 700]
    size: [40, 1240]

  # =========================
  # FILA SUPERIOR (4 puestos)
  # =========================
  - name: office_table_1_circle
    type: circle
    position: [320, 450]
    radius: 60

  - name: office_chair_1
    type: circle
    position: [320, 545]
    radius: 62

